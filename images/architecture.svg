<svg width="680" viewBox="0 0 680 580" xmlns="http://www.w3.org/2000/svg" style="font-family: sans-serif; background: white;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- 섹션 레이블 -->
  <text font-size="12" x="80" y="24" text-anchor="middle" fill="#aaa">Front-end</text>
  <text font-size="12" x="430" y="24" text-anchor="middle" fill="#aaa">Back-end</text>

  <!-- Gradio 구분선 -->
  <line x1="210" y1="14" x2="210" y2="560" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4"/>
  <rect x="170" y="8" width="80" height="22" rx="4" fill="#fff" stroke="#ddd" stroke-width="0.8"/>
  <text font-size="12" x="210" y="23" text-anchor="middle" fill="#888">Gradio</text>

  <!-- 교안 업로드 -->
  <rect x="20" y="50" width="160" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text font-size="13" font-weight="500" x="100" y="73" text-anchor="middle" fill="#085041">교안 업로드</text>
  <text font-size="11" x="100" y="91" text-anchor="middle" fill="#0F6E56">PPT 파일</text>

  <!-- 프롬프트 입력 -->
  <rect x="20" y="130" width="160" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text font-size="13" font-weight="500" x="100" y="153" text-anchor="middle" fill="#085041">프롬프트 입력</text>
  <text font-size="11" x="100" y="171" text-anchor="middle" fill="#0F6E56">강의 지침, 목소리, 톤</text>

  <!-- 교안 → 정보 분해 -->
  <line x1="180" y1="76" x2="248" y2="76" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 정보 분해 -->
  <rect x="248" y="50" width="180" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text font-size="13" font-weight="500" x="338" y="73" text-anchor="middle" fill="#26215C">정보 분해</text>
  <text font-size="11" x="338" y="91" text-anchor="middle" fill="#534AB7">그림 · 표 · 텍스트</text>

  <!-- 정보 분해 → 페이지별 내용 생성 -->
  <line x1="338" y1="102" x2="338" y2="150" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 페이지별 내용 생성 -->
  <rect x="248" y="150" width="180" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text font-size="13" font-weight="500" x="338" y="173" text-anchor="middle" fill="#26215C">페이지별 내용 생성</text>
  <text font-size="11" x="338" y="191" text-anchor="middle" fill="#534AB7">웹 검색 보완 포함</text>

  <!-- 페이지별 → 강의 스크립트 -->
  <line x1="428" y1="176" x2="476" y2="176" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 강의 스크립트 생성 -->
  <rect x="476" y="150" width="180" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text font-size="13" font-weight="500" x="566" y="173" text-anchor="middle" fill="#26215C">강의 스크립트 생성</text>
  <text font-size="11" x="566" y="191" text-anchor="middle" fill="#534AB7">검토 · 요약 포함</text>

  <!-- 강의 스크립트 → 음성 변환 (꺾어서) -->
  <path d="M566 202 L566 250 L338 250 L338 298" fill="none" stroke="#aaa" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 페이지별 → 음성 변환 (직선, 위의 꺾임과 겹치므로 생략) -->

  <!-- 음성 변환 -->
  <rect x="248" y="298" width="180" height="52" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
  <text font-size="13" font-weight="500" x="338" y="321" text-anchor="middle" fill="#4A1B0C">음성 변환</text>
  <text font-size="11" x="338" y="339" text-anchor="middle" fill="#993C1D">TTS 합성</text>

  <!-- 음성 변환 → 영상 제작 -->
  <line x1="428" y1="324" x2="476" y2="324" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 영상 제작 -->
  <rect x="476" y="298" width="180" height="52" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
  <text font-size="13" font-weight="500" x="566" y="321" text-anchor="middle" fill="#4A1B0C">영상 제작</text>
  <text font-size="11" x="566" y="339" text-anchor="middle" fill="#993C1D">슬라이드 + 음성</text>

  <!-- 영상 제작 → 반복 다이아몬드 -->
  <line x1="566" y1="350" x2="566" y2="390" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 반복 다이아몬드 -->
  <polygon points="566,390 612,418 566,446 520,418" fill="#f9f9f9" stroke="#888" stroke-width="1"/>
  <text font-size="12" x="566" y="422" text-anchor="middle" fill="#555">반복</text>

  <!-- 반복 → 오른쪽 → 페이지별 내용 생성 -->
  <path d="M612 418 L645 418 L645 176 L656 176" fill="none" stroke="#bbb" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text font-size="11" x="652" y="300" text-anchor="middle" fill="#aaa" transform="rotate(-90,652,300)">다음 슬라이드</text>

  <!-- 반복 done → 영상 합치기 -->
  <path d="M520 418 L338 418 L338 466" fill="none" stroke="#aaa" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 영상 합치기 -->
  <rect x="248" y="466" width="180" height="52" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
  <text font-size="13" font-weight="500" x="338" y="489" text-anchor="middle" fill="#4A1B0C">영상 합치기</text>
  <text font-size="11" x="338" y="507" text-anchor="middle" fill="#993C1D">최종 강의 영상</text>

  <!-- 영상 합치기 → 강의 영상 파일 -->
  <line x1="248" y1="492" x2="196" y2="492" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 강의 영상 파일 -->
  <rect x="20" y="466" width="160" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text font-size="13" font-weight="500" x="100" y="489" text-anchor="middle" fill="#085041">강의 영상 파일</text>
  <text font-size="11" x="100" y="507" text-anchor="middle" fill="#0F6E56">MP4 출력</text>
</svg>
